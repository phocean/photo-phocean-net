<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>J-C. Baptiste — photographies</title>
<link rel="canonical" href="https://photo.jcbaptiste.com/">
<script>
  // Ancien site SmugMug → nouveau site. Les galeries qui ont une série équivalente y mènent directement ;
  // toutes les autres adresses mènent à l'accueil. La langue est ensuite choisie par le nouveau site.
  (function () {
    var site = "https://photo.jcbaptiste.com";
    var series = [
      ["/japon/rue", "/la-rue-au-japon/"],
      ["/nature/arbres", "/arbres/"],
      ["/nature/oiseaux", "/animaux-sauvages/"],
      ["/paysages", "/paysages/"]
    ];
    var chemin = "/";
    try { chemin = decodeURIComponent(location.pathname).toLowerCase(); } catch (e) {}
    var cible = "/";
    for (var i = 0; i < series.length; i++) {
      var p = series[i][0];
      if (chemin === p || chemin.indexOf(p + "/") === 0) { cible = series[i][1]; break; }
    }
    location.replace(site + cible);
  })();
</script>
<meta http-equiv="refresh" content="2; url=https://photo.jcbaptiste.com/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAFAF8; color: #1A1A1A;
         font: 17px/1.6 Georgia, "Times New Roman", serif; text-align: center; }
  a { color: inherit; }
  @media (prefers-color-scheme: dark) { body { background: #121212; color: #EDEDEA; } }
</style>
</head>
<body>
<p>Le site a déménagé · This site has moved · 移転しました<br>
<a href="https://photo.jcbaptiste.com/">photo.jcbaptiste.com</a></p>
</body>
</html>
